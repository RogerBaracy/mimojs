<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>MimoInputText Docs</title>

    <link rel="stylesheet" href="../../../../public/assets/mimo-grid.css" />

    <style>
      body {
        font-family: Arial;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
      }

      .intro {
        margin-bottom: 20px;
      }

      section {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .preview {
        padding: 15px;
        border: 1px dashed #ccc;
        margin-bottom: 15px;
      }

      .controls label {
        display: block;
        font-size: 12px;
        margin-top: 10px;
      }

      .controls input {
        display: block;
        margin-bottom: 5px;
        padding: 6px;
        width: 100%;
        max-width: 360px;
      }

      button {
        padding: 6px 10px;
        cursor: pointer;
        margin-top: 10px;
      }

      pre {
        background: #222;
        color: #0f0;
        padding: 10px;
        border-radius: 6px;
        overflow-x: auto;
      }

      .code-container {
        border: 1px solid #273447;
        border-radius: 12px;
        overflow: hidden;
        background: #0f172a;
        box-shadow: 0 10px 24px rgba(2, 6, 23, 0.25);
      }

      .editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        background: #111827;
        border-bottom: 1px solid #243044;
      }

      .editor-meta {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .editor-dots {
        display: flex;
        gap: 6px;
      }

      .editor-dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .editor-dots span:nth-child(1) {
        background: #fb7185;
      }

      .editor-dots span:nth-child(2) {
        background: #fbbf24;
      }

      .editor-dots span:nth-child(3) {
        background: #4ade80;
      }

      #editorLabel {
        font-size: 12px;
        color: #a5b4fc;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .editor-body {
        display: grid;
        grid-template-columns: 46px 1fr;
        max-height: 430px;
        overflow: auto;
      }

      #lineNumbers {
        margin: 0;
        padding: 12px 8px;
        background: #0b1220;
        color: #64748b;
        border-right: 1px solid #243044;
        text-align: right;
        font-size: 12px;
        line-height: 1.55;
        user-select: none;
        white-space: pre;
      }

      #code {
        margin: 0;
        min-height: 220px;
        padding: 12px 14px;
        border-radius: 0;
        background: #0f172a;
        color: #e2e8f0;
        line-height: 1.55;
        font-size: 12.5px;
        overflow: visible;
        font-family:
          "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo,
          Monaco, Consolas, "Liberation Mono", monospace;
      }

      .code-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }

      .code-tab {
        border: 1px solid #bbb;
        background: #f0f0f0;
        color: #222;
        border-radius: 6px;
        padding: 6px 10px;
        margin-top: 0;
      }

      .code-tab.active {
        background: #222;
        color: #fff;
        border-color: #222;
      }

      #copyBtn {
        margin-top: 0;
        border: 1px solid #334155;
        background: #1f2937;
        color: #e2e8f0;
        padding: 6px 10px;
        border-radius: 4px;
      }

      #copyBtn:hover {
        background: #334155;
      }

      .events-container {
        position: relative;
      }

      #events {
        min-height: 50px;
        max-height: 120px;
        overflow-y: auto;
        background: #111;
        color: #0f0;
        padding: 10px;
        border-radius: 6px;
      }

      #clearEventsBtn {
        position: absolute;
        right: 10px;
        top: 10px;
        background: #333;
        color: white;
        border: none;
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 4px;
      }

      #clearEventsBtn:hover {
        background: #555;
      }

      @media (max-width: 767px) {
        body {
          padding: 14px;
        }

        section {
          padding: 14px;
        }

        .controls input {
          max-width: none;
        }

        .editor-body {
          grid-template-columns: 38px 1fr;
        }

        #code {
          font-size: 11.5px;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="intro">
        <h1>MimoInputText</h1>
        <p>&lt;mimo-input-text&gt;</p>
      </div>

      <div class="row cols-12">
        <div class="col-12">
          <section>
            <h2>🚀 Preview</h2>
            <div class="preview" id="preview"></div>
          </section>

          <section>
            <h2>⚙️ Teste interativo</h2>
            <div class="controls" id="controls"></div>
            <button onclick="resetComponent()">🧹 Limpar</button>
          </section>
        </div>

        <div class="col-12">
          <h2>📄 Código</h2>
          <div class="code-tabs" id="codeTabs">
            <button
              class="code-tab active"
              onclick="setFramework('javascript')"
            >
              JavaScript
            </button>
            <button class="code-tab" onclick="setFramework('angular')">
              Angular
            </button>
            <button class="code-tab" onclick="setFramework('react')">
              React
            </button>
            <button class="code-tab" onclick="setFramework('vue')">Vue</button>
          </div>
          <div class="code-container">
            <div class="editor-header">
              <div class="editor-meta">
                <div class="editor-dots">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
                <span id="editorLabel">HTML</span>
              </div>
              <button id="copyBtn" onclick="copyCode()">📋</button>
            </div>
            <div class="editor-body">
              <pre id="lineNumbers">1</pre>
              <pre id="code"></pre>
            </div>
          </div>

          <h2>📡 Eventos</h2>
          <div class="events-container">
            <button id="clearEventsBtn" onclick="clearEvents()">
              🧹 Limpar
            </button>
            <pre id="events"></pre>
          </div>
        </div>
      </div>
    </div>

    <!-- LIB -->
    <script type="module" src="/src/main.ts"></script>

    <script>
      const tag = "mimo-input-text";

      const preview = document.getElementById("preview");
      const controls = document.getElementById("controls");
      const code = document.getElementById("code");
      const lineNumbers = document.getElementById("lineNumbers");
      const editorLabel = document.getElementById("editorLabel");
      const codeTabs = document.getElementById("codeTabs");
      const events = document.getElementById("events");

      let el;
      let componentClass;
      let selectedFramework = "javascript";
      let props = [];
      let slots = [];
      let eventsList = [];

      // =========================

      // =========================
      // 🔥 INIT (AGUARDANDO COMPONENTE)
      // =========================
      async function init() {
        await customElements.whenDefined(tag);

        componentClass = customElements.get(tag);

        if (!componentClass) {
          console.warn("Componente não encontrado:", tag);
          return;
        }

        // attributesList e eventsList são propriedades de instância
        const probe = document.createElement(tag);

        console.log("Componente encontrado:", componentClass);
        const attributes = probe.attributesList ||
          componentClass.observedAttributes || [
            "value",
            "placeholder",
            "disabled",
            "readonly",
            "required",
          ];

        props = attributes.map((a) => ({
          name: a,
          type:
            a === "disabled" || a === "readonly" || a === "required"
              ? "boolean"
              : "string",
        }));

        slots = getSlotsFromComponent(probe);

        eventsList = probe.eventsList || [
          "valueChange",
          "input",
          "change",
          "blur",
        ];

        createComponent();
        createControls();
      }

      // =========================
      // COMPONENT
      // =========================
      function createComponent() {
        preview.innerHTML = "";
        events.innerText = "";

        el = document.createElement(tag);

        // Registra dinamicamente todos os eventos públicos do componente.
        eventsList.forEach((eventName) => {
          el.addEventListener(eventName, (e) => {
            addEvent(eventName, e.detail ?? "(sem detail)");
          });
        });

        preview.appendChild(el);
        updateCode();
      }

      function updateCode() {
        const snippet = getFrameworkCode(selectedFramework);
        code.innerText = snippet;
        updateEditorMeta();
        updateLineNumbers(snippet);
      }

      function updateEditorMeta() {
        const labels = {
          javascript: "HTML",
          angular: "Angular",
          react: "React",
          vue: "Vue",
        };

        editorLabel.innerText = labels[selectedFramework] || "Codigo";
      }

      function updateLineNumbers(text) {
        const totalLines = Math.max(1, text.split("\n").length);
        lineNumbers.innerText = Array.from({ length: totalLines }, (_, index) =>
          String(index + 1),
        ).join("\n");
      }

      function setFramework(framework) {
        selectedFramework = framework;
        updateFrameworkTabs();
        updateCode();
      }

      function updateFrameworkTabs() {
        const buttons = codeTabs.querySelectorAll(".code-tab");

        buttons.forEach((button) => {
          const isActive = button.innerText
            .toLowerCase()
            .includes(selectedFramework);
          button.classList.toggle("active", isActive);
        });
      }

      function getFrameworkCode(framework) {
        const markup = el.outerHTML;
        const minLibPath =
          "https://rogerbaracy.github.io/mimojs/mimojs.min.mjs";
        const scriptClose = "</" + "script>";

        if (framework === "angular") {
          return `// app.component.html\n${markup}\n\n// main.ts\nimport "${minLibPath}";\n\n// app.module.ts\nimport { CUSTOM_ELEMENTS_SCHEMA, NgModule } from "@angular/core";\n\n@NgModule({\n  schemas: [CUSTOM_ELEMENTS_SCHEMA],\n})\nexport class AppModule {}`;
        }

        if (framework === "react") {
          return `import "${minLibPath}";\n\nexport default function App() {\n  return (\n    <>\n      ${markup}\n    </>\n  );\n}`;
        }

        if (framework === "vue") {
          return `<template>\n  ${markup}\n</template>\n\n<script setup>\nimport "${minLibPath}";\n${scriptClose}`;
        }

        return `<!doctype html>\n<html lang="pt-BR">\n  <head>\n    <meta charset="UTF-8" />\n    <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n    <title>Exemplo MimoJS</title>\n    <script type="module" src="${minLibPath}">${scriptClose}\n  </head>\n  <body>\n    ${markup}\n  </body>\n</html>`;
      }

      // =========================
      // CONTROLS DINÂMICOS
      // =========================
      function createControls() {
        controls.innerHTML = "";

        const attrsTitle = document.createElement("h3");
        attrsTitle.innerText = "Atributos";
        controls.appendChild(attrsTitle);

        props.forEach((p) => {
          const label = document.createElement("label");
          label.innerText = p.name;

          let input;

          if (p.type === "boolean") {
            input = document.createElement("input");
            input.type = "checkbox";

            input.addEventListener("change", () => {
              el.toggleAttribute(p.name, input.checked);
              updateCode();
            });
          } else {
            input = document.createElement("input");
            input.placeholder = p.name;

            input.addEventListener("input", () => {
              if (input.value) {
                el.setAttribute(p.name, input.value);
              } else {
                el.removeAttribute(p.name);
              }

              updateCode();
            });
          }

          controls.appendChild(label);
          controls.appendChild(input);
        });

        if (slots.length > 0) {
          const slotsTitle = document.createElement("h3");
          slotsTitle.innerText = "Slots";
          controls.appendChild(slotsTitle);

          slots.forEach((slotName) => {
            const label = document.createElement("label");
            label.innerText = slotName || "default";

            const input = document.createElement("input");
            input.placeholder = `conteúdo do slot ${slotName || "default"}`;

            input.addEventListener("input", () => {
              setSlotContent(slotName, input.value);
              updateCode();
            });

            controls.appendChild(label);
            controls.appendChild(input);
          });
        }
      }

      function getSlotsFromComponent(probe) {
        if (Array.isArray(probe.slotsList) && probe.slotsList.length > 0) {
          return probe.slotsList;
        }

        const tempHost = document.createElement("div");
        tempHost.style.display = "none";
        document.body.appendChild(tempHost);
        tempHost.appendChild(probe);

        const foundSlots = Array.from(
          probe.shadowRoot?.querySelectorAll("slot") || [],
        )
          .map((slotEl) => slotEl.getAttribute("name") || "")
          .filter((name, index, arr) => arr.indexOf(name) === index);

        tempHost.remove();

        return foundSlots;
      }

      function setSlotContent(slotName, value) {
        const slotKey = slotName || "default";
        const selector = `[data-doc-slot="${slotKey}"]`;
        const existing = el.querySelector(selector);

        if (!value || !value.trim()) {
          if (existing) {
            existing.remove();
          }
          return;
        }

        const target = existing || document.createElement("span");
        target.setAttribute("data-doc-slot", slotKey);

        if (slotName) {
          target.setAttribute("slot", slotName);
        } else {
          target.removeAttribute("slot");
        }

        target.textContent = value;

        if (!existing) {
          el.appendChild(target);
        }
      }

      // =========================
      // EVENTS LOG
      // =========================
      function addEvent(name, detail) {
        const time = new Date().toLocaleTimeString();

        events.innerText += `[${time}] ${name}: ${detail}\n`;
        events.scrollTop = events.scrollHeight;
      }

      function clearEvents() {
        events.innerText = "";
      }

      // =========================
      // RESET
      // =========================
      function resetComponent() {
        init();
      }

      // =========================
      // COPY
      // =========================
      function copyCode() {
        navigator.clipboard.writeText(code.innerText).then(() => {
          const btn = document.getElementById("copyBtn");
          const original = btn.innerText;

          btn.innerText = "✅";

          setTimeout(() => {
            btn.innerText = original;
          }, 1000);
        });
      }

      // start
      init();
    </script>
  </body>
</html>
